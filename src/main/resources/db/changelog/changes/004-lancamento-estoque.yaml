databaseChangeLog:
  - changeSet:
      id: 004-lancamento-estoque
      author: GabrielVicente12
      comment: Histórico de entradas e saídas; saldo e lançamento são gravados na mesma transação.
      changes:
        - sql:
            sql: |
              CREATE TABLE lancamento_estoque (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                produto_id BIGINT NOT NULL,
                tipo VARCHAR(10) NOT NULL,
                quantidade NUMERIC(18,3) NOT NULL,
                saldo_anterior NUMERIC(18,3) NOT NULL,
                saldo_posterior NUMERIC(18,3) NOT NULL,
                data_lancamento TIMESTAMP WITH TIME ZONE NOT NULL,
                observacao VARCHAR(255),
                CONSTRAINT fk_lancamento_produto FOREIGN KEY (produto_id) REFERENCES produto(id) ON DELETE RESTRICT,
                CONSTRAINT ck_lancamento_tipo CHECK (tipo IN ('ENTRADA', 'SAIDA')),
                CONSTRAINT ck_lancamento_quantidade CHECK (quantidade > 0),
                CONSTRAINT ck_lancamento_saldos CHECK (saldo_anterior >= 0 AND saldo_posterior >= 0),
                CONSTRAINT ck_lancamento_calculo CHECK (
                  (tipo = 'ENTRADA' AND saldo_posterior = saldo_anterior + quantidade) OR
                  (tipo = 'SAIDA' AND saldo_posterior = saldo_anterior - quantidade))
              );
              CREATE INDEX ix_lancamento_produto ON lancamento_estoque(produto_id, id);
      rollback:
        - dropTable:
            tableName: lancamento_estoque
