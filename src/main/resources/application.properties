spring.application.name=estoquecontrol

# Exige a escolha consciente do ambiente: dev, test ou prod.
spring.profiles.default=none

# Liquibase cria/evolui o esquema; Hibernate apenas confere o mapeamento.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.database-change-log-table=historico_migracao
spring.liquibase.database-change-log-lock-table=bloqueio_migracao
spring.jackson.deserialization.fail-on-unknown-properties=true
